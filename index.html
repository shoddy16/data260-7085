<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HW2 - Local Restaurant Inspections</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            background: #00eeee;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 650px;
            margin: auto;
        }

        h1 {
            text-align: center;
        }

        form,
        .search-section,
        .inspection-card {
            background: white;
            padding: 24px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #999;
            border-radius: 5px;
            font-size: 16px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .terms {
            margin-top: 15px;
        }

        .terms input {
            width: auto;
        }

        button {
            margin-top: 15px;
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            background: #222;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            opacity: 0.85;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .state {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .hidden {
            display: none;
        }

        .inspection-list {
            margin-top: 20px;
        }

        .inspection-card h3 {
            margin-top: 0;
        }

        @media (max-width: 375px) {
            body {
                padding: 15px 10px;
            }

            form,
            .search-section,
            .inspection-card {
                padding: 16px;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Local Restaurant Inspections</h1>

        <form id="inspectionForm">
            <label for="restaurantName">Restaurant Name</label>
            <input
                type="text"
                id="restaurantName"
                name="restaurantName"
                required
                autofocus
            >

            <label for="location">Location</label>
            <input
                type="text"
                id="location"
                name="location"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <label for="description">Inspection Description</label>
            <textarea
                id="description"
                name="description"
                required
            ></textarea>

            <label for="category">Category</label>
            <select id="category" name="category" required>
                <option value="">Select a category</option>
                <option value="Passed">Passed</option>
                <option value="Conditional Pass">Conditional Pass</option>
                <option value="Reinspection Required">Reinspection Required</option>
                <option value="Violation or Failed">Violation or Failed</option>
            </select>

            <div class="terms">
                <input type="checkbox" id="terms" required>
                <label for="terms" style="display: inline;">
                    I agree to the terms and conditions.
                </label>
            </div>

            <button type="submit">Submit Inspection</button>
        </form>

        <div class="search-section">
            <h2>Search Inspections</h2>

            <input
                type="text"
                id="searchInput"
                placeholder="Search by restaurant name or location"
            >

            <button type="button" id="searchButton">Search</button>
            <button type="button" id="clearSearchButton">Clear Search</button>
        </div>

        <div class="search-section">
            <h2>Inspection Actions</h2>

            <div class="action-buttons">
                <button type="button" id="updateButton">
                    Update Inspection ID 
                </button>

                <button type="button" id="deleteButton">
                    Delete Highest ID
                </button>
            </div>
        </div>

        <div id="loadingState" class="state">
            Loading inspections...
        </div>

        <div id="emptyState" class="state hidden">
            No inspection records found.
        </div>

        <div id="errorState" class="state hidden">
            Unable to load inspection records.
        </div>

        <div id="inspectionList" class="inspection-list"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
