<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Inspections</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Restaurant Inspections</a>

            <div>
                {% if user %}
                    <span class="text-white me-3">Welcome, {{ user }}</span>
                    <a href="/dashboard" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
                    <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
                {% else %}
                    <a href="/login" class="btn btn-outline-light btn-sm">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="text-center">
            <h1 class="display-5">Restaurant Inspections</h1>

            {% if user %}
                <p class="lead">
                    Welcome back, {{ user }}!
                </p>

                <a href="/dashboard" class="btn btn-primary">
                    Go to Dashboard
                </a>
            {% else %}
                <p class="lead">
                    Welcome to the Restaurant Inspections application.
                </p>

                <a href="/login" class="btn btn-primary">
                    Login
                </a>
            {% endif %}
        </div>
    </main>

</body>
</html>
