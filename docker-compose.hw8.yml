services:
  kafka:
    image: apache/kafka:3.9.2
    container_name: s7085-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports: ["9092:9092", "29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
  kafka-init:
    image: apache/kafka:3.9.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "for t in s7085_entity_requests s7085_entity_responses s7085_inbox s7085_drafts s7085_final s7085_dead_letter; do
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic $$t --partitions 1 --replication-factor 1 --bootstrap-server kafka:9092; done;
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic s7085_tasks --partitions 2 --replication-factor 1 --bootstrap-server kafka:9092"
  api:
    build:
      context: .
      dockerfile: Dockerfile.hw8
    command: uvicorn main:app --host 127.0.0.1 --port 8085
    ports: ["8085:8085"]
    depends_on: [kafka-init]
  worker:
    build:
      context: .
      dockerfile: Dockerfile.hw8
    command: python kafka_runtime.py
    depends_on: [kafka-init]
  planner:
    build:
      context: .
      dockerfile: Dockerfile.hw8
    command: python planner.py
    depends_on: [kafka-init]
  writer:
    build:
      context: .
      dockerfile: Dockerfile.hw8
    command: python writer.py
    depends_on: [kafka-init]
  reviewer:
    build:
      context: .
      dockerfile: Dockerfile.hw8
    command: python reviewer.py
    depends_on: [kafka-init]
